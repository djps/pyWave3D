name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      # beartype is on unless PYWAVE3D_NO_BEARTYPE is set; tests/test_beartype.py fails if it is off
      - run: pytest --cov=pywave3d --cov-report=lcov
      - uses: coverallsapp/github-action@v2
        if: matrix.python == '3.12'   # upload once, not once per matrix entry
        with:
          file: coverage.lcov
